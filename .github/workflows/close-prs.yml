# Automatically close pull requests — this project does not accept contributions.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thank you for your interest in **vTuber Combat Chess**.',
              '',
              'This project **does not accept pull requests**.',
              'Please keep your changes in a **fork** under the GPL-3 license.',
              '',
              'There is no warranty and no official support.',
              '— Lord Intellectual'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
